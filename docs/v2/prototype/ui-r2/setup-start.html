<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首次配网 - 二开版原型</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ececec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .device-frame {
            background: #333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .screen {
            width: 400px;
            height: 300px;
            background: #fff;
            border: 2px solid #000;
            overflow: hidden;
            position: relative;
        }
        .content {
            width: 400px;
            height: 300px;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            height: 28px;
            border-bottom: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 11px;
            flex-shrink: 0;
        }
        .top-left,
        .top-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .main-area {
            flex: 1;
            padding: 8px 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .setup-icon {
            font-size: 30px;
            margin-top: 2px;
            margin-bottom: 4px;
        }
        .setup-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .info-card {
            width: 100%;
            border: 2px solid #000;
            padding: 8px 10px;
            margin-bottom: 8px;
        }
        .info-label {
            font-size: 11px;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
        }
        .hint-box {
            width: 100%;
            padding: 6px 4px 0;
            font-size: 12px;
            line-height: 1.55;
        }
        .hint-emphasis {
            font-weight: 700;
        }
        .footer {
            height: 24px;
            border-top: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            flex-shrink: 0;
        }
        .dot {
            width: 7px;
            height: 7px;
            background: #000;
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="screen">
            <div class="content">
                <div class="top-bar">
                    <div class="top-left">
                        <span>22°C</span>
                        <span>65%</span>
                    </div>
                    <div class="top-right">
                        <span><i class="fas fa-bolt"></i></span>
                        <span><i class="fas fa-battery-three-quarters"></i> 85%</span>
                    </div>
                </div>

                <div class="main-area">
                    <div class="setup-icon"><i class="fas fa-gears"></i></div>
                    <div class="setup-title">首次配网</div>

                    <div class="info-card">
                        <div class="info-label">WiFi名称</div>
                        <div class="info-value">Xiaozhi-370D</div>
                    </div>

                    <div class="info-card">
                        <div class="info-label">访问地址</div>
                        <div class="info-value">http://192.168.4.1</div>
                    </div>

                    <div class="hint-box">
                        请先连接上方热点，<span class="hint-emphasis">再在浏览器中打开访问地址</span>完成配置
                    </div>
                </div>

                <div class="footer">
                    <span class="dot"></span>
                    <span>等待连接中...</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
