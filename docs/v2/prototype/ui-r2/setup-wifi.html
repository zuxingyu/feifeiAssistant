<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi配置 - 小智AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 30px 25px;
            text-align: center;
        }
        .header-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .step-bar {
            display: flex;
            justify-content: center;
            padding: 15px 0;
            background: #f8f9fa;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #999;
        }
        .step.active { color: #667eea; font-weight: bold; }
        .step.done { color: #4caf50; }
        .step-num {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ddd;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }
        .step.active .step-num { background: #667eea; }
        .step.done .step-num { background: #4caf50; }
        .step-connector {
            width: 30px;
            height: 2px;
            background: #ddd;
            margin: 0 5px;
        }
        .step.done + .step-connector,
        .step.done ~ .step.done { background: #4caf50; }
        .body {
            padding: 25px;
        }
        .wifi-list {
            margin-bottom: 20px;
        }
        .wifi-list h3 {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .wifi-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .wifi-item:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        .wifi-item.selected {
            border-color: #667eea;
            background: #f5f7ff;
        }
        .wifi-item-icon {
            font-size: 20px;
            color: #667eea;
            margin-right: 12px;
        }
        .wifi-item-info { flex: 1; }
        .wifi-item-name { font-size: 14px; font-weight: 500; }
        .wifi-item-signal { font-size: 11px; color: #999; margin-top: 2px; }
        .wifi-item-check {
            color: #667eea;
            font-size: 18px;
            display: none;
        }
        .wifi-item.selected .wifi-item-check { display: block; }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-prev {
            background: #f0f0f0;
            color: #666;
        }
        .btn-prev:hover { background: #e0e0e0; }
        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-next:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon"><i class="fas fa-wifi"></i></div>
            <h1>小智AI 智能助手</h1>
            <p>首次配置 - 第1步</p>
        </div>

        <div class="step-bar">
            <div class="step done">
                <div class="step-num"><i class="fas fa-check"></i></div>
            </div>
            <div class="step-connector"></div>
            <div class="step active">
                <div class="step-num">1</div>
                <span>WiFi</span>
            </div>
            <div class="step-connector"></div>
            <div class="step">
                <div class="step-num">2</div>
                <span>课程</span>
            </div>
            <div class="step-connector"></div>
            <div class="step">
                <div class="step-num">3</div>
                <span>天气</span>
            </div>
            <div class="step-connector"></div>
            <div class="step">
                <div class="step-num">4</div>
                <span>完成</span>
            </div>
        </div>

        <div class="body">
            <div class="wifi-list">
                <h3>请选择要连接的WiFi网络</h3>
                <div class="wifi-item selected" onclick="selectWifi(this)">
                    <div class="wifi-item-icon"><i class="fas fa-wifi"></i></div>
                    <div class="wifi-item-info">
                        <div class="wifi-item-name">Xiaomi_5G</div>
                        <div class="wifi-item-signal">信号: 很强</div>
                    </div>
                    <div class="wifi-item-check"><i class="fas fa-check-circle"></i></div>
                </div>
                <div class="wifi-item" onclick="selectWifi(this)">
                    <div class="wifi-item-icon"><i class="fas fa-wifi"></i></div>
                    <div class="wifi-item-info">
                        <div class="wifi-item-name">Home_WiFi_2.4G</div>
                        <div class="wifi-item-signal">信号: 强</div>
                    </div>
                    <div class="wifi-item-check"><i class="fas fa-check-circle"></i></div>
                </div>
                <div class="wifi-item" onclick="selectWifi(this)">
                    <div class="wifi-item-icon"><i class="fas fa-lock"></i></div>
                    <div class="wifi-item-info">
                        <div class="wifi-item-name">Guest_Network</div>
                        <div class="wifi-item-signal">信号: 中</div>
                    </div>
                    <div class="wifi-item-check"><i class="fas fa-check-circle"></i></div>
                </div>
            </div>

            <div class="input-group">
                <label>WiFi密码</label>
                <input type="password" placeholder="请输入WiFi密码" value="12345678">
            </div>

            <div class="btn-area">
                <button class="btn btn-prev" onclick="location.href='setup-start.html'">
                    <i class="fas fa-arrow-left"></i> 上一步
                </button>
                <button class="btn btn-next" onclick="location.href='setup-schedule.html'">
                    下一步 <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        function selectWifi(el) {
            document.querySelectorAll('.wifi-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
        }
    </script>
</body>
</html>
