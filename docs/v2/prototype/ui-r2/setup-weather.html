<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气配置 - 小智AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
            color: #fff;
            padding: 30px 25px;
            text-align: center;
        }
        .header-icon { font-size: 40px; margin-bottom: 10px; }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .step-bar {
            display: flex;
            justify-content: center;
            padding: 15px 0;
            background: #f8f9fa;
        }
        .step { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #999; }
        .step.active { color: #ee0979; font-weight: bold; }
        .step.done { color: #4caf50; }
        .step-num {
            width: 20px; height: 20px; border-radius: 50%;
            background: #ddd; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }
        .step.active .step-num { background: #ee0979; }
        .step.done .step-num { background: #4caf50; }
        .step-connector { width: 25px; height: 2px; background: #ddd; margin: 0 3px; }
        .body { padding: 25px; }
        .info-box {
            background: #fff5f8;
            border: 1px solid #f5c6d0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        .info-box a { color: #ee0979; text-decoration: none; }
        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 13px; color: #666; margin-bottom: 6px;
        }
        .input-group label span {
            font-size: 11px; color: #999; margin-left: 5px;
        }
        .input-group input {
            width: 100%; padding: 12px 15px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 14px; transition: border-color 0.2s;
        }
        .input-group input:focus { outline: none; border-color: #ee0979; }
        .btn-area { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1; padding: 14px; border: none;
            border-radius: 10px; font-size: 15px;
            font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .btn-prev { background: #f0f0f0; color: #666; }
        .btn-prev:hover { background: #e0e0e0; }
        .btn-next {
            background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
            color: #fff;
        }
        .btn-next:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(238, 9, 121, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon"><i class="fas fa-cloud-sun"></i></div>
            <h1>天气配置</h1>
            <p>首次配置 - 第3步</p>
        </div>

        <div class="step-bar">
            <div class="step done"><div class="step-num"><i class="fas fa-check"></i></div></div>
            <div class="step-connector"></div>
            <div class="step done"><div class="step-num"><i class="fas fa-check"></i></div></div>
            <div class="step-connector"></div>
            <div class="step done"><div class="step-num"><i class="fas fa-check"></i></div></div>
            <div class="step-connector"></div>
            <div class="step active"><div class="step-num">3</div><span>天气</span></div>
            <div class="step-connector"></div>
            <div class="step"><div class="step-num">4</div><span>完成</span></div>
        </div>

        <div class="body">
            <div class="info-box">
                <i class="fas fa-info-circle" style="color:#ee0979;margin-right:5px;"></i>
                请到 <a href="https://www.seniverse.com" target="_blank">心和天气</a> 注册账号并获取Key和Secret，免费版即可使用。
            </div>

            <div class="input-group">
                <label>心和技术 Key<span>必填</span></label>
                <input type="text" placeholder="请输入Key" value="Seniverse_Key_12345">
            </div>

            <div class="input-group">
                <label>心和技术 Secret<span>必填</span></label>
                <input type="text" placeholder="请输入Secret" value="Seniverse_Secret_abcdef">
            </div>

            <div class="input-group">
                <label>城市名称<span>默认使用IP定位</span></label>
                <input type="text" placeholder="例如: 北京、上海、深圳" value="深圳">
            </div>

            <div class="btn-area">
                <button class="btn btn-prev" onclick="location.href='setup-schedule.html'">
                    <i class="fas fa-arrow-left"></i> 上一步
                </button>
                <button class="btn btn-next" onclick="location.href='setup-done.html'">
                    完成 <i class="fas fa-check"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
