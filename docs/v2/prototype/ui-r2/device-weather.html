<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气详情</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .device-frame {
            background: #333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .screen {
            width: 400px;
            height: 300px;
            background: #fff;
            border: 2px solid #000;
            overflow: hidden;
            position: relative;
        }
        .content {
            width: 400px;
            height: 300px;
            display: flex;
            flex-direction: column;
        }
        /* 顶部状态栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #000;
            font-size: 11px;
            flex-shrink: 0;
            height: 28px;
        }
        .top-left { display: flex; gap: 5px; align-items: center; }
        .top-right { display: flex; gap: 5px; align-items: center; }
        /* 页面标题 */
        .page-title {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 0;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }
        /* 4天天气格子 */
        .forecast-row {
            display: flex;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }
        .forecast-col {
            flex: 1;
            text-align: center;
            padding: 6px 2px;
            border-right: 1px solid #000;
        }
        .forecast-col:last-child { border-right: none; }
        .forecast-day { font-size: 11px; font-weight: bold; }
        .forecast-icon { font-size: 16px; margin: 3px 0; }
        .forecast-temp { font-size: 12px; }
        .forecast-weather { font-size: 10px; }
        /* 折线图区 */
        .chart-area {
            flex: 1;
            padding: 6px 10px;
        }
        .chart-title {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .chart-svg {
            width: 100%;
            height: 70px;
        }
        .chart-legend {
            display: flex;
            gap: 15px;
            font-size: 10px;
            margin-top: 3px;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-line { width: 14px; height: 2px; }
        .legend-line.high { background: #000; }
        .legend-line.low { background: none; border-top: 2px dashed #000; }
        /* 今日详情 */
        .today-detail {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #000;
            padding: 5px 0;
            flex-shrink: 0;
        }
        .detail-item { text-align: center; font-size: 11px; }
        .detail-label { font-size: 10px; }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="screen">
            <div class="content">
                <!-- 顶部状态栏 -->
                <div class="top-bar">
                    <div class="top-left">
                        <span>12:33</span>
                        <span>22°C</span>
                        <span>65%</span>
                    </div>
                    <div class="top-right">
                        <span><i class="fas fa-wifi"></i></span>
                        <span><i class="fas fa-battery-three-quarters"></i> 85%</span>
                    </div>
                </div>

                <!-- 标题 -->
                <div class="page-title">近四天天气</div>

                <!-- 4天天气格子 -->
                <div class="forecast-row">
                    <div class="forecast-col">
                        <div class="forecast-day">今天</div>
                        <div class="forecast-icon"><i class="fas fa-sun"></i></div>
                        <div class="forecast-temp">22/12°C</div>
                        <div class="forecast-weather">晴</div>
                    </div>
                    <div class="forecast-col">
                        <div class="forecast-day">明天</div>
                        <div class="forecast-icon"><i class="fas fa-cloud"></i></div>
                        <div class="forecast-temp">20/11°C</div>
                        <div class="forecast-weather">多云</div>
                    </div>
                    <div class="forecast-col">
                        <div class="forecast-day">后天</div>
                        <div class="forecast-icon"><i class="fas fa-cloud-rain"></i></div>
                        <div class="forecast-temp">18/10°C</div>
                        <div class="forecast-weather">小雨</div>
                    </div>
                    <div class="forecast-col">
                        <div class="forecast-day">大后天</div>
                        <div class="forecast-icon"><i class="fas fa-cloud"></i></div>
                        <div class="forecast-temp">17/9°C</div>
                        <div class="forecast-weather">阴</div>
                    </div>
                </div>

                <!-- 折线图 -->
                <div class="chart-area">
                    <div class="chart-title">气温趋势</div>
                    <svg class="chart-svg" viewBox="0 0 360 70" preserveAspectRatio="none">
                        <line x1="0" y1="15" x2="360" y2="15" stroke="#000" stroke-width="0.5" stroke-dasharray="2,2"/>
                        <line x1="0" y1="35" x2="360" y2="35" stroke="#000" stroke-width="0.5" stroke-dasharray="2,2"/>
                        <line x1="0" y1="55" x2="360" y2="55" stroke="#000" stroke-width="0.5" stroke-dasharray="2,2"/>
                        <!-- 最高温实线 -->
                        <polyline points="30,18 120,22 210,36 300,42" fill="none" stroke="#000" stroke-width="2"/>
                        <circle cx="30" cy="18" r="3" fill="#000"/>
                        <circle cx="120" cy="22" r="3" fill="#000"/>
                        <circle cx="210" cy="36" r="3" fill="#000"/>
                        <circle cx="300" cy="42" r="3" fill="#000"/>
                        <!-- 最低温虚线 -->
                        <polyline points="30,32 120,40 210,50 300,55" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2"/>
                        <circle cx="30" cy="32" r="2.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                        <circle cx="120" cy="40" r="2.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                        <circle cx="210" cy="50" r="2.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                        <circle cx="300" cy="55" r="2.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                        <!-- 温度标签 -->
                        <text x="30" y="12" font-size="10" text-anchor="middle" font-weight="bold">22°C</text>
                        <text x="120" y="16" font-size="10" text-anchor="middle" font-weight="bold">20°C</text>
                        <text x="210" y="30" font-size="10" text-anchor="middle" font-weight="bold">18°C</text>
                        <text x="300" y="36" font-size="10" text-anchor="middle" font-weight="bold">17°C</text>
                        <text x="30" y="46" font-size="10" text-anchor="middle">12°C</text>
                        <text x="120" y="54" font-size="10" text-anchor="middle">11°C</text>
                        <text x="210" y="64" font-size="10" text-anchor="middle">10°C</text>
                        <text x="300" y="69" font-size="10" text-anchor="middle">9°C</text>
                    </svg>
                    <div class="chart-legend">
                        <div class="legend-item">
                            <div class="legend-line high"></div>
                            <span>最高温</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-line low"></div>
                            <span>最低温</span>
                        </div>
                    </div>
                </div>

                <!-- 今日详情 -->
                <div class="today-detail">
                    <div class="detail-item">
                        <div class="detail-label">湿度</div>
                        <div>65%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">风力</div>
                        <div>2级</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">PM2.5</div>
                        <div>良</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
