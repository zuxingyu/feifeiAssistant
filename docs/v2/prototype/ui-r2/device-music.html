<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .device-frame {
            background: #333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .screen {
            width: 400px;
            height: 300px;
            background: #fff;
            border: 2px solid #000;
            overflow: hidden;
            position: relative;
        }
        .content {
            width: 400px;
            height: 300px;
            display: flex;
            flex-direction: column;
        }
        /* 顶部状态栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #000;
            font-size: 11px;
            flex-shrink: 0;
            height: 28px;
        }
        .top-left { display: flex; gap: 5px; align-items: center; }
        .top-right { display: flex; gap: 5px; align-items: center; }

        /* 歌曲信息 */
        .song-info {
            text-align: center;
            padding: 10px 8px 6px 8px;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }
        .song-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .song-artist {
            font-size: 11px;
        }

        /* 进度条 */
        .progress-area {
            padding: 8px 14px 4px 14px;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }
        .progress-bar {
            height: 8px;
            border: 1px solid #000;
            margin-bottom: 4px;
        }
        .progress-fill {
            height: 100%;
            width: 35%;
            background: #000;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding: 10px 0 4px 0;
            flex-shrink: 0;
        }
        .ctrl-btn {
            font-size: 22px;
            color: #000;
            padding: 4px 8px;
        }
        .ctrl-btn.play {
            font-size: 32px;
        }

        /* 歌词区 */
        .lyrics-area {
            flex: 1;
            margin: 4px 14px 8px 14px;
            padding: 6px 10px;
            border: 1px solid #000;
            overflow: hidden;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .lyric-line {
            font-size: 11px;
            line-height: 2;
        }
        .lyric-line.active {
            font-weight: bold;
            font-size: 14px;
        }
        .lyric-line.prev,
        .lyric-line.next {
            opacity: 0.4;
        }

        /* 唤醒后聊天浮层（默认隐藏，按物理按钮唤醒小智后显示） */
        .chat-popup {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 2px solid #000;
            padding: 5px 8px;
            font-size: 11px;
            height: 28px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="screen">
            <div class="content">
                <!-- 顶部状态栏 -->
                <div class="top-bar">
                    <div class="top-left">
                        <span>4月29日 周三</span>
                        <span>22°C</span>
                        <span>65%</span>
                    </div>
                    <div class="top-right">
                        <span><i class="fas fa-wifi"></i></span>
                        <span><i class="fas fa-battery-three-quarters"></i> 85%</span>
                    </div>
                </div>

                <!-- 歌曲信息 -->
                <div class="song-info">
                    <div class="song-title">小星星</div>
                    <div class="song-artist">儿童合唱团</div>
                </div>

                <!-- 进度条 -->
                <div class="progress-area">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="progress-time">
                        <span>1:23</span>
                        <span>3:45</span>
                    </div>
                </div>

                <!-- 控制按钮 -->
                <div class="controls">
                    <span class="ctrl-btn"><i class="fas fa-step-backward"></i></span>
                    <span class="ctrl-btn play"><i class="fas fa-pause"></i></span>
                    <span class="ctrl-btn"><i class="fas fa-step-forward"></i></span>
                </div>

                <!-- 歌词 -->
                <div class="lyrics-area">
                    <div class="lyric-line prev">一闪一闪亮晶晶</div>
                    <div class="lyric-line active">满天都是小星星</div>
                    <div class="lyric-line next">挂在天上放光明</div>
                </div>
            </div>

            <!-- 唤醒小智后显示（默认隐藏） -->
            <!-- <div class="chat-popup">小智: 这首歌真好听!</div> -->
        </div>
    </div>
</body>
</html>
