<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .device-frame {
            background: #333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .screen {
            width: 400px;
            height: 300px;
            background: #fff;
            border: 2px solid #000;
            overflow: hidden;
            position: relative;
        }
        .content {
            width: 400px;
            height: 300px;
            display: flex;
            flex-direction: column;
        }
        /* 顶部状态栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #000;
            font-size: 10px;
            flex-shrink: 0;
            height: 28px;
        }
        .top-left {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .top-right {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        /* 歌曲信息 */
        .song-info {
            text-align: center;
            padding: 8px 10px 4px 10px;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }
        .song-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .song-meta {
            font-size: 11px;
        }
        /* 进度条区 */
        .progress-area {
            padding: 6px 10px;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }
        .progress-bar {
            height: 6px;
            border: 1px solid #000;
            margin-bottom: 3px;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 35%;
            background: #000;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
        /* 控制区 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 8px 0;
            font-size: 16px;
            flex-shrink: 0;
        }
        /* 歌词区 */
        .lyrics-area {
            flex: 1;
            border: 1px solid #000;
            margin: 0 10px;
            padding: 6px 12px;
            overflow: hidden;
        }
        .lyric-line {
            font-size: 11px;
            line-height: 1.8;
        }
        .lyric-line.active {
            font-weight: bold;
            font-size: 13px;
        }
        /* 唤醒聊天浮层 */
        .chat-popup {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            border-top: 2px solid #000;
            background: #fff;
            padding: 5px 8px;
            font-size: 11px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="screen">
            <div class="content">
                <!-- 顶部状态栏 -->
                <div class="top-bar">
                    <div class="top-left">
                        <span>12:33</span>
                        <span>22°C</span>
                        <span>65%</span>
                    </div>
                    <div class="top-right">
                        <span><i class="fas fa-wifi"></i></span>
                        <span><i class="fas fa-battery-three-quarters"></i> 85%</span>
                    </div>
                </div>

                <!-- 歌曲信息 -->
                <div class="song-info">
                    <div class="song-title">小小星星</div>
                    <div class="song-meta">歌手: 儿童合唱团 | 专辑: 睡前故事</div>
                </div>

                <!-- 进度条 -->
                <div class="progress-area">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="progress-time">
                        <span>1:23</span>
                        <span>3:45</span>
                    </div>
                </div>

                <!-- 控制图标 -->
                <div class="controls">
                    <span><i class="fas fa-step-backward"></i></span>
                    <span><i class="fas fa-pause"></i></span>
                    <span><i class="fas fa-step-forward"></i></span>
                </div>

                <!-- 歌词 -->
                <div class="lyrics-area">
                    <div class="lyric-line">一闪一闪亮晶晶</div>
                    <div class="lyric-line active">满天都是小星星</div>
                    <div class="lyric-line">挂在天上放光明</div>
                    <div class="lyric-line">好像许多小眼睛</div>
                </div>

                <!-- 唤醒后聊天浮层(隐藏) -->
                <div class="chat-popup">
                    小智: 这首歌好听吗?
                </div>
            </div>
        </div>
    </div>
</body>
</html>
