<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程表配置 - 小智AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
            padding: 25px;
            text-align: center;
        }
        .header-icon { font-size: 36px; margin-bottom: 8px; }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header p { font-size: 12px; opacity: 0.9; }
        .step-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            background: #f8f9fa;
        }
        .step { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #999; }
        .step.active { color: #11998e; font-weight: bold; }
        .step.done { color: #4caf50; }
        .step-num {
            width: 20px; height: 20px; border-radius: 50%;
            background: #ddd; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }
        .step.active .step-num { background: #11998e; }
        .step.done .step-num { background: #4caf50; }
        .step-connector { width: 25px; height: 2px; background: #ddd; margin: 0 3px; }
        .body { padding: 20px; max-height: 70vh; overflow-y: auto; }
        /* 日期设置 */
        .date-range {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .date-field { flex: 1; }
        .date-field label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .date-field input {
            width: 100%; padding: 10px 12px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 13px;
        }
        .date-field input:focus { outline: none; border-color: #11998e; }
        /* 单双周 */
        .week-toggle-area {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .week-btn {
            flex: 1; padding: 10px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            background: #fff; font-size: 13px; cursor: pointer;
            text-align: center; transition: all 0.2s;
        }
        .week-btn.active {
            border-color: #11998e; background: #e8f8f5; color: #11998e; font-weight: bold;
        }
        /* 课程表编辑 */
        .schedule-edit h3 {
            font-size: 13px; color: #666; margin-bottom: 10px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .schedule-table th {
            background: #f0f0f0;
            padding: 8px 4px;
            font-weight: 500;
            text-align: center;
            border: 1px solid #e0e0e0;
        }
        .schedule-table td {
            padding: 5px 4px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }
        .schedule-table input {
            width: 100%; padding: 5px 3px;
            border: 1px solid #e0e0e0; border-radius: 4px;
            font-size: 11px; text-align: center;
        }
        .schedule-table input:focus { outline: none; border-color: #11998e; }
        .period-label {
            background: #f5f5f5; font-weight: bold; font-size: 11px;
            text-align: center !important;
        }
        /* 复制按钮 */
        .copy-row {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .copy-btn {
            padding: 6px 15px;
            background: #f0f0f0; border: 1px solid #ccc;
            border-radius: 6px; font-size: 11px; cursor: pointer;
        }
        .copy-btn:hover { background: #e0e0e0; }
        /* 底部按钮 */
        .btn-area {
            display: flex; gap: 10px; margin-top: 15px;
        }
        .btn {
            flex: 1; padding: 13px; border: none;
            border-radius: 10px; font-size: 14px;
            font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .btn-prev { background: #f0f0f0; color: #666; }
        .btn-prev:hover { background: #e0e0e0; }
        .btn-next {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }
        .btn-next:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon"><i class="fas fa-calendar-alt"></i></div>
            <h1>课程表配置</h1>
            <p>首次配置 - 第2步</p>
        </div>

        <div class="step-bar">
            <div class="step done"><div class="step-num"><i class="fas fa-check"></i></div></div>
            <div class="step-connector"></div>
            <div class="step done"><div class="step-num"><i class="fas fa-check"></i></div></div>
            <div class="step-connector"></div>
            <div class="step active"><div class="step-num">2</div><span>课程</span></div>
            <div class="step-connector"></div>
            <div class="step"><div class="step-num">3</div><span>天气</span></div>
            <div class="step-connector"></div>
            <div class="step"><div class="step-num">4</div><span>完成</span></div>
        </div>

        <div class="body">
            <!-- 学期日期 -->
            <div class="date-range">
                <div class="date-field">
                    <label>学期开始日期</label>
                    <input type="date" value="2025-02-17">
                </div>
                <div class="date-field">
                    <label>学期结束日期</label>
                    <input type="date" value="2025-07-04">
                </div>
            </div>

            <!-- 单双周切换 -->
            <div class="week-toggle-area">
                <div class="week-btn active" onclick="toggleWeek(this, 'single')">单周课程</div>
                <div class="week-btn" onclick="toggleWeek(this, 'dual')">双周课程</div>
            </div>

            <!-- 课程表编辑 -->
            <div class="schedule-edit">
                <h3>上午课程 (第1-4节)</h3>
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th style="width:40px;"></th>
                            <th>周一</th>
                            <th>周二</th>
                            <th>周三</th>
                            <th>周四</th>
                            <th>周五</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="period-label">上1</td>
                            <td><input type="text" value="语文"></td>
                            <td><input type="text" value="数学"></td>
                            <td><input type="text" value="语文"></td>
                            <td><input type="text" value="数学"></td>
                            <td><input type="text" value="语文"></td>
                        </tr>
                        <tr>
                            <td class="period-label">上2</td>
                            <td><input type="text" value="数学"></td>
                            <td><input type="text" value="语文"></td>
                            <td><input type="text" value="数学"></td>
                            <td><input type="text" value="语文"></td>
                            <td><input type="text" value="数学"></td>
                        </tr>
                        <tr>
                            <td class="period-label">上3</td>
                            <td><input type="text" value="英语"></td>
                            <td><input type="text" value="科学"></td>
                            <td><input type="text" value="英语"></td>
                            <td><input type="text" value="品德"></td>
                            <td><input type="text" value="英语"></td>
                        </tr>
                        <tr>
                            <td class="period-label">上4</td>
                            <td><input type="text" value="体育"></td>
                            <td><input type="text" value="品德"></td>
                            <td><input type="text" value="音乐"></td>
                            <td><input type="text" value="科学"></td>
                            <td><input type="text" value="体育"></td>
                        </tr>
                    </tbody>
                </table>

                <h3 style="margin-top:12px;">下午课程 (第5-8节)</h3>
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th style="width:40px;"></th>
                            <th>周一</th>
                            <th>周二</th>
                            <th>周三</th>
                            <th>周四</th>
                            <th>周五</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="period-label">下1</td>
                            <td><input type="text" value="美术"></td>
                            <td><input type="text" value="英语"></td>
                            <td><input type="text" value="体育"></td>
                            <td><input type="text" value="英语"></td>
                            <td><input type="text" value="美术"></td>
                        </tr>
                        <tr>
                            <td class="period-label">下2</td>
                            <td><input type="text" value="音乐"></td>
                            <td><input type="text" value="体育"></td>
                            <td><input type="text" value="美术"></td>
                            <td><input type="text" value="体育"></td>
                            <td><input type="text" value="道法"></td>
                        </tr>
                        <tr>
                            <td class="period-label">下3</td>
                            <td><input type="text" value="道法"></td>
                            <td><input type="text" value="写字"></td>
                            <td><input type="text" value="科学"></td>
                            <td><input type="text" value="音乐"></td>
                            <td><input type="text" value="科学"></td>
                        </tr>
                        <tr>
                            <td class="period-label">下4</td>
                            <td><input type="text" value="自习"></td>
                            <td><input type="text" value="自习"></td>
                            <td><input type="text" value="班会"></td>
                            <td><input type="text" value="道法"></td>
                            <td><input type="text" value="劳动"></td>
                        </tr>
                    </tbody>
                </table>

                <div class="copy-row">
                    <button class="copy-btn" onclick="copyWeek()">
                        <i class="fas fa-copy"></i> 从单周复制到双周
                    </button>
                </div>
            </div>

            <div class="btn-area">
                <button class="btn btn-prev" onclick="location.href='setup-wifi.html'">
                    <i class="fas fa-arrow-left"></i> 上一步
                </button>
                <button class="btn btn-next" onclick="location.href='setup-weather.html'">
                    下一步 <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleWeek(el, type) {
            document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }
        function copyWeek() {
            alert('已复制到双周');
        }
    </script>
</body>
</html>
