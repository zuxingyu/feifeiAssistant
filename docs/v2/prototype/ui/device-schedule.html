<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程表</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .device-frame {
            background: #333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .screen {
            width: 400px;
            height: 300px;
            background: #fff;
            border: 2px solid #000;
            overflow: hidden;
            position: relative;
        }
        .content {
            width: 400px;
            height: 300px;
            display: flex;
            flex-direction: column;
        }
        /* 顶部状态栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #000;
            font-size: 11px;
            flex-shrink: 0;
            height: 28px;
        }
        .top-left { display: flex; gap: 5px; align-items: center; }
        .top-right { display: flex; gap: 5px; align-items: center; }
        /* 课程表头部 */
        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }
        .week-toggle {
            font-size: 11px;
            border: 1px solid #000;
            padding: 2px 6px;
            cursor: pointer;
        }
        .week-toggle.active {
            background: #000;
            color: #fff;
        }
        .date-range {
            font-size: 11px;
        }
        /* 课程表网格 */
        .schedule-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 星期行 */
        .weekday-row {
            display: flex;
            border-bottom: 1px solid #000;
            flex-shrink: 0;
        }
        .period-col {
            width: 28px;
            font-size: 9px;
            text-align: center;
            padding: 3px 0;
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.3;
        }
        .day-header {
            flex: 1;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 0;
            border-right: 1px solid #000;
        }
        .day-header:last-child { border-right: none; }
        /* 课程行 */
        .course-row {
            display: flex;
            flex: 1;
            border-bottom: 1px solid #000;
        }
        .course-row:last-child { border-bottom: none; }
        .period-col {
            width: 28px;
            font-size: 9px;
            text-align: center;
            padding: 3px 0;
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .period-col .p-label { font-weight: bold; font-size: 10px; }
        .period-col .p-num { font-size: 9px; }
        .day-cell {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2px;
            border-right: 1px solid #000;
            font-size: 10px;
            overflow: hidden;
            text-align: center;
            line-height: 1.3;
        }
        .day-cell:last-child { border-right: none; }
        .cell-name {
            font-size: 11px;
            font-weight: bold;
        }
        /* 午休分隔 */
        .lunch-row {
            display: flex;
            border-bottom: 1px solid #000;
            background: #f5f5f5;
            flex-shrink: 0;
        }
        .lunch-label {
            width: 28px;
            border-right: 1px solid #000;
            font-size: 9px;
            text-align: center;
            padding: 2px 0;
        }
        .lunch-cell {
            flex: 1;
            font-size: 10px;
            text-align: center;
            padding: 2px;
            border-right: 1px solid #000;
            color: #555;
        }
        .lunch-cell:last-child { border-right: none; }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="screen">
            <div class="content">
                <!-- 顶部状态栏 -->
                <div class="top-bar">
                    <div class="top-left">
                        <span>12:33</span>
                        <span>22°C</span>
                        <span>65%</span>
                    </div>
                    <div class="top-right">
                        <span><i class="fas fa-wifi"></i></span>
                        <span><i class="fas fa-battery-three-quarters"></i> 85%</span>
                    </div>
                </div>

                <!-- 周切换 + 日期 -->
                <div class="schedule-header">
                    <div>
                        <span class="week-toggle active">单周</span>
                        <span class="week-toggle">双周</span>
                    </div>
                    <div class="date-range">1月2日-1月6日</div>
                </div>

                <!-- 课程表主体 -->
                <div class="schedule-body">
                    <!-- 星期行 -->
                    <div class="weekday-row">
                        <div class="period-col"></div>
                        <div class="day-header">周一</div>
                        <div class="day-header">周二</div>
                        <div class="day-header">周三</div>
                        <div class="day-header">周四</div>
                        <div class="day-header">周五</div>
                    </div>

                    <!-- 上午4节 -->
                    <div class="course-row">
                        <div class="period-col"><span class="p-label">上</span><span class="p-num">1</span></div>
                        <div class="day-cell"><span class="cell-name">语文</span></div>
                        <div class="day-cell"><span class="cell-name">数学</span></div>
                        <div class="day-cell"><span class="cell-name">语文</span></div>
                        <div class="day-cell"><span class="cell-name">数学</span></div>
                        <div class="day-cell"><span class="cell-name">语文</span></div>
                    </div>
                    <div class="course-row">
                        <div class="period-col"><span class="p-label">上</span><span class="p-num">2</span></div>
                        <div class="day-cell"><span class="cell-name">数学</span></div>
                        <div class="day-cell"><span class="cell-name">语文</span></div>
                        <div class="day-cell"><span class="cell-name">数学</span></div>
                        <div class="day-cell"><span class="cell-name">语文</span></div>
                        <div class="day-cell"><span class="cell-name">数学</span></div>
                    </div>
                    <div class="course-row">
                        <div class="period-col"><span class="p-label">上</span><span class="p-num">3</span></div>
                        <div class="day-cell"><span class="cell-name">英语</span></div>
                        <div class="day-cell"><span class="cell-name">科学</span></div>
                        <div class="day-cell"><span class="cell-name">英语</span></div>
                        <div class="day-cell"><span class="cell-name">品德</span></div>
                        <div class="day-cell"><span class="cell-name">英语</span></div>
                    </div>
                    <div class="course-row">
                        <div class="period-col"><span class="p-label">上</span><span class="p-num">4</span></div>
                        <div class="day-cell"><span class="cell-name">体育</span></div>
                        <div class="day-cell"><span class="cell-name">品德</span></div>
                        <div class="day-cell"><span class="cell-name">音乐</span></div>
                        <div class="day-cell"><span class="cell-name">科学</span></div>
                        <div class="day-cell"><span class="cell-name">体育</span></div>
                    </div>

                    <!-- 午休 -->
                    <div class="lunch-row">
                        <div class="lunch-label"></div>
                        <div class="lunch-cell">午休</div>
                        <div class="lunch-cell">午休</div>
                        <div class="lunch-cell">午休</div>
                        <div class="lunch-cell">午休</div>
                        <div class="lunch-cell">午休</div>
                    </div>

                    <!-- 下午4节 -->
                    <div class="course-row">
                        <div class="period-col"><span class="p-label">下</span><span class="p-num">1</span></div>
                        <div class="day-cell"><span class="cell-name">美术</span></div>
                        <div class="day-cell"><span class="cell-name">英语</span></div>
                        <div class="day-cell"><span class="cell-name">体育</span></div>
                        <div class="day-cell"><span class="cell-name">英语</span></div>
                        <div class="day-cell"><span class="cell-name">美术</span></div>
                    </div>
                    <div class="course-row">
                        <div class="period-col"><span class="p-label">下</span><span class="p-num">2</span></div>
                        <div class="day-cell"><span class="cell-name">音乐</span></div>
                        <div class="day-cell"><span class="cell-name">体育</span></div>
                        <div class="day-cell"><span class="cell-name">美术</span></div>
                        <div class="day-cell"><span class="cell-name">体育</span></div>
                        <div class="day-cell"><span class="cell-name">道法</span></div>
                    </div>
                    <div class="course-row">
                        <div class="period-col"><span class="p-label">下</span><span class="p-num">3</span></div>
                        <div class="day-cell"><span class="cell-name">道法</span></div>
                        <div class="day-cell"><span class="cell-name">写字</span></div>
                        <div class="day-cell"><span class="cell-name">科学</span></div>
                        <div class="day-cell"><span class="cell-name">音乐</span></div>
                        <div class="day-cell"><span class="cell-name">科学</span></div>
                    </div>
                    <div class="course-row">
                        <div class="period-col"><span class="p-label">下</span><span class="p-num">4</span></div>
                        <div class="day-cell"><span class="cell-name">自习</span></div>
                        <div class="day-cell"><span class="cell-name">自习</span></div>
                        <div class="day-cell"><span class="cell-name">班会</span></div>
                        <div class="day-cell"><span class="cell-name">道法</span></div>
                        <div class="day-cell"><span class="cell-name">劳动</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
