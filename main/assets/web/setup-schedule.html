<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>课程表 - 菲菲AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(135deg,#11998e,#38ef7d);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
.container{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:520px;overflow:hidden}
.header{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;padding:25px;text-align:center}
.header h1{font-size:20px;margin-bottom:5px}.header p{font-size:12px;opacity:.9}
.step-bar{display:flex;justify-content:center;align-items:center;padding:12px 0;background:#f8f9fa}
.step{display:flex;align-items:center;gap:4px;font-size:11px;color:#999}
.step.active{color:#11998e;font-weight:700}.step.done{color:#4caf50}
.step-num{width:20px;height:20px;border-radius:50%;background:#ddd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px}
.step.active .step-num{background:#11998e}.step.done .step-num{background:#4caf50}
.step-connector{width:25px;height:2px;background:#ddd;margin:0 3px}.step.done+.step-connector{background:#4caf50}
.body{padding:20px;max-height:70vh;overflow-y:auto}
.date-range{display:flex;gap:10px;margin-bottom:15px}.date-field{flex:1}
.date-field label{display:block;font-size:12px;color:#666;margin-bottom:5px}
.date-field input{width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:10px;font-size:13px}
.date-field input:focus{outline:none;border-color:#11998e}
.week-area{display:flex;gap:8px;margin-bottom:15px}
.week-btn{flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;text-align:center}
.week-btn.active{border-color:#11998e;background:#e8f8f5;color:#11998e;font-weight:700}
.schedule-table{width:100%;border-collapse:collapse;font-size:12px}
.schedule-table th{background:#f0f0f0;padding:8px 4px;text-align:center;border:1px solid #e0e0e0}
.schedule-table td{padding:5px 4px;text-align:center;border:1px solid #e0e0e0}
.schedule-table input{width:100%;padding:5px 3px;border:1px solid #e0e0e0;border-radius:4px;font-size:11px;text-align:center}
.schedule-table input:focus{outline:none;border-color:#11998e}
.period-label{background:#f5f5f5;font-weight:700;font-size:11px}
.copy-row{display:flex;justify-content:center;margin:10px 0}
.copy-btn{padding:6px 15px;background:#f0f0f0;border:1px solid #ccc;border-radius:6px;font-size:11px;cursor:pointer}
.copy-btn:hover{background:#e0e0e0}
.error{color:#e74c3c;font-size:13px;text-align:center;padding:8px;display:none}
.btn-area{display:flex;gap:10px;margin-top:15px}
.btn{flex:1;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-prev{background:#f0f0f0;color:#666}.btn-prev:hover{background:#e0e0e0}
.btn-next{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}
.btn-next:disabled{opacity:.5;cursor:not-allowed}
</style></head>
<body><div class="container">
<div class="header"><h1>📅 课程表配置</h1><p id="subtitle">设置 · 第2步</p></div>
<div class="step-bar" id="stepBar">
<div class="step done"><div class="step-num">✓</div></div><div class="step-connector"></div>
<div class="step active"><div class="step-num">2</div><span>课程</span></div><div class="step-connector"></div>
<div class="step"><div class="step-num">3</div><span>天气</span></div><div class="step-connector"></div>
<div class="step"><div class="step-num">4</div><span>完成</span></div>
</div>
<div class="body">
<div class="date-range"><div class="date-field"><label>学期开始</label><input type="date" id="semester_start" value="2025-02-17"></div><div class="date-field"><label>学期结束</label><input type="date" id="semester_end" value="2025-07-04"></div></div>
<div class="week-area"><div class="week-btn active" onclick="swW('single')">📘 单周</div><div class="week-btn" onclick="swW('double')">📗 双周</div></div>
<div id="editor"></div>
<div class="copy-row"><button class="copy-btn" onclick="copySD()">📋 单周→双周</button></div>
<div class="error" id="err"></div>
<div class="btn-area"><button class="btn btn-prev" id="prevBtn" onclick="location.href='/'">← 上一步</button><button class="btn btn-next" id="saveBtn" onclick="save()">下一步 →</button></div>
</div></div>
<script>
var cw='single',sd={single:null,double:null};
var standalone=location.search.indexOf('standalone=1')>=0||location.search.indexOf('mode=edit')>=0;
if(standalone){document.getElementById('subtitle').textContent='课程表维护';document.getElementById('stepBar').style.display='none';document.getElementById('prevBtn').style.display='none';document.getElementById('saveBtn').textContent='保存课程表'}
function me(){var s={};for(var d=0;d<5;d++){s['day'+d]=['','','','','','','','']}return s}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function render(){
var s=sd[cw];if(!s){s=me();sd[cw]=s}
var h='<h3 style="font-size:13px;color:#666;margin-bottom:10px;">上午 (1-4节)</h3><table class="schedule-table"><thead><tr><th style="width:40px;"></th><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th></tr></thead><tbody>';
for(var p=0;p<4;p++){h+='<tr><td class="period-label">上'+(p+1)+'</td>';for(var d=0;d<5;d++){var v=(s['day'+d]&&s['day'+d][p])?s['day'+d][p]:'';h+='<td><input id="s_'+cw+'_'+d+'_'+p+'" value="'+esc(v)+'"></td>'}h+='</tr>'}
h+='</tbody></table><h3 style="font-size:13px;color:#666;margin:12px 0 10px;">下午 (5-8节)</h3><table class="schedule-table"><thead><tr><th style="width:40px;"></th><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th></tr></thead><tbody>';
for(var p=4;p<8;p++){h+='<tr><td class="period-label">下'+(p-3)+'</td>';for(var d=0;d<5;d++){var v=(s['day'+d]&&s['day'+d][p])?s['day'+d][p]:'';h+='<td><input id="s_'+cw+'_'+d+'_'+p+'" value="'+esc(v)+'"></td>'}h+='</tr>'}
h+='</tbody></table>';document.getElementById('editor').innerHTML=h}
function col(){var s={};for(var d=0;d<5;d++){s['day'+d]=[];for(var p=0;p<8;p++){var el=document.getElementById('s_'+cw+'_'+d+'_'+p);s['day'+d].push(el?el.value.trim():'')}}sd[cw]=s}
function swW(w){col();cw=w;document.querySelectorAll('.week-btn').forEach(function(b){b.classList.remove('active')});if(w==='single')document.querySelectorAll('.week-btn')[0].classList.add('active');else document.querySelectorAll('.week-btn')[1].classList.add('active');render()}
function copySD(){col();if(!sd.single){alert('请先填写单周课程');return}sd.double=JSON.parse(JSON.stringify(sd.single));swW('double')}
function setMsg(t,ok){var e=document.getElementById('err');e.textContent=t;e.style.color=ok?'#11998e':'#e74c3c';e.style.display='block'}
function save(){col();document.getElementById('err').style.display='none';document.getElementById('saveBtn').disabled=true;document.getElementById('saveBtn').textContent='保存中...';
var d={semester_start:document.getElementById('semester_start').value,semester_end:document.getElementById('semester_end').value,schedule_single:sd.single||me(),schedule_double:sd.double||sd.single||me()};
fetch('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(j){if(j.success){if(standalone){setMsg('保存成功，屏幕会自动读取新的课程表',true);document.getElementById('saveBtn').disabled=false;document.getElementById('saveBtn').textContent='保存课程表'}else location.href='/weather.html'}else{setMsg('保存失败',false);document.getElementById('saveBtn').disabled=false;document.getElementById('saveBtn').textContent=standalone?'保存课程表':'下一步 →'}}).catch(function(){setMsg('网络错误',false);document.getElementById('saveBtn').disabled=false;document.getElementById('saveBtn').textContent=standalone?'保存课程表':'下一步 →'})}
fetch('/api/config/status').then(function(r){return r.json()}).then(function(d){if(d.semester_start)document.getElementById('semester_start').value=d.semester_start;if(d.semester_end)document.getElementById('semester_end').value=d.semester_end;if(d.schedule_single)sd.single=d.schedule_single;if(d.schedule_double)sd.double=d.schedule_double;render()}).catch(function(){render()});
</script></body></html>
