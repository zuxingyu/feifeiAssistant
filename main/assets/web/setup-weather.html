<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>天气配置 - 小智AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(135deg,#ee0979,#ff6a00);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
.container{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:420px;overflow:hidden}
.header{background:linear-gradient(135deg,#ee0979,#ff6a00);color:#fff;padding:30px 25px;text-align:center}
.header h1{font-size:22px;margin-bottom:5px}.header p{font-size:13px;opacity:.9}
.step-bar{display:flex;justify-content:center;padding:15px 0;background:#f8f9fa}
.step{display:flex;align-items:center;gap:4px;font-size:11px;color:#999}.step.active{color:#ee0979;font-weight:700}.step.done{color:#4caf50}
.step-num{width:20px;height:20px;border-radius:50%;background:#ddd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px}
.step.active .step-num{background:#ee0979}.step.done .step-num{background:#4caf50}
.step-connector{width:25px;height:2px;background:#ddd;margin:0 3px}.step.done+.step-connector{background:#4caf50}
.body{padding:25px}
.info-box{background:#fff5f8;border:1px solid #f5c6d0;border-radius:10px;padding:15px;margin-bottom:20px;font-size:12px;color:#666;line-height:1.6}
.input-group{margin-bottom:15px}.input-group input{width:100%;padding:12px 15px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px}.input-group input:focus{outline:none;border-color:#ee0979}
.input-group label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.error{color:#e74c3c;font-size:13px;text-align:center;padding:8px;display:none}
.btn-area{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.btn-prev{background:#f0f0f0;color:#666}.btn-prev:hover{background:#e0e0e0}
.btn-next{background:linear-gradient(135deg,#ee0979,#ff6a00);color:#fff}.btn-next:disabled{opacity:.5}
</style></head>
<body><div class="container">
<div class="header"><h1>🌤️ 天气配置</h1><p>设置 · 第3步</p></div>
<div class="step-bar">
<div class="step done"><div class="step-num">✓</div></div><div class="step-connector"></div>
<div class="step done"><div class="step-num">✓</div></div><div class="step-connector"></div>
<div class="step active"><div class="step-num">3</div><span>天气</span></div><div class="step-connector"></div>
<div class="step"><div class="step-num">4</div><span>完成</span></div>
</div>
<div class="body">
<div class="info-box">请到 <b>心和天气</b> (seniverse.com) 注册免费账号获取 API 私钥。免费版每日400次。</div>
<div class="input-group"><label>API 私钥 <span style="font-size:11px;color:#999">必填</span></label><input type="text" id="api_key" placeholder="请输入心和天气 API 私钥"></div>
<div class="input-group"><label>城市名称 <span style="font-size:11px;color:#999">默认IP自动定位</span></label><input type="text" id="city" placeholder="例如: 北京、上海、深圳"></div>
<div class="input-group"><label>音乐解析服务 <span style="font-size:11px;color:#999">可选</span></label><input type="text" id="music_resolver" placeholder="例如: http://192.168.0.104:8765/prepare"></div>
<div class="error" id="err"></div>
<div class="btn-area">
<button class="btn btn-prev" onclick="location.href='/schedule.html'">← 上一步</button>
<button class="btn btn-next" id="saveBtn" onclick="save()">下一步 →</button>
</div>
</div></div>
<script>
fetch('/api/config/status').then(function(r){return r.json()}).then(function(d){if(d.weather_key)document.getElementById('api_key').value=d.weather_key;if(d.weather_city)document.getElementById('city').value=d.weather_city;if(d.music_resolver)document.getElementById('music_resolver').value=d.music_resolver}).catch(function(){});
function save(){
document.getElementById('err').style.display='none';var b=document.getElementById('saveBtn');b.disabled=true;b.textContent='保存中...';
var d={api_key:document.getElementById('api_key').value.trim(),city:document.getElementById('city').value.trim(),music_resolver:document.getElementById('music_resolver').value.trim()};
fetch('/api/weather',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(j){if(j.success)location.href='/done.html';else{var e=document.getElementById('err');e.textContent='保存失败';e.style.display='block';b.disabled=false;b.textContent='下一步 →'}}).catch(function(){var e=document.getElementById('err');e.textContent='网络错误';e.style.display='block';b.disabled=false;b.textContent='下一步 →'})}
</script></body></html>
