<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>配置完成 - 菲菲AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(135deg,#00c6ff,#0072ff);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
.container{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:420px;overflow:hidden}
.header{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;padding:30px 25px;text-align:center}
.header h1{font-size:22px}.header p{font-size:13px;opacity:.9}
.step-bar{display:flex;justify-content:center;padding:15px 0;background:#f8f9fa}
.step{display:flex;align-items:center;gap:4px;font-size:11px;color:#999}.step.done{color:#4caf50}
.step-num{width:20px;height:20px;border-radius:50%;background:#4caf50;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px}
.step-connector{width:25px;height:2px;background:#4caf50;margin:0 3px}
.body{padding:25px;text-align:center}
.ok{font-size:60px;margin-bottom:15px}.body h2{font-size:18px;margin-bottom:10px}
.body p.desc{font-size:13px;color:#666;line-height:1.6;margin-bottom:20px}
.summary{background:#f8f9fa;border-radius:10px;padding:15px;margin-bottom:20px;text-align:left}
.summary-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e0e0e0;font-size:13px}.summary-item:last-child{border-bottom:none}
.summary-label{color:#666}.summary-value{color:#333;font-weight:500;max-width:60%;text-align:right;word-break:break-all}
.next-step{background:#e8f4ff;border-radius:10px;padding:15px;margin-bottom:20px;text-align:left;font-size:12px;color:#333;line-height:1.8}
.btn-area{display:flex;gap:10px}.btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.btn-reconfig{background:#f0f0f0;color:#666}
.btn-start{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff}
</style></head>
<body><div class="container">
<div class="header"><h1>🚀 配置完成!</h1><p>菲菲AI正在启动...</p></div>
<div class="step-bar">
<div class="step done"><div class="step-num">✓</div></div><div class="step-connector"></div>
<div class="step done"><div class="step-num">✓</div></div><div class="step-connector"></div>
<div class="step done"><div class="step-num">✓</div></div><div class="step-connector"></div>
<div class="step done"><div class="step-num">✓</div></div>
</div>
<div class="body">
<div class="ok">✅</div><h2>所有配置已完成!</h2><p class="desc">设备正在连接网络并进入主页</p>
<div class="summary" id="sum"><div style="text-align:center;color:#999;font-size:13px;">加载中...</div></div>
<div class="next-step">设备联网后主页将显示时间、天气和课程。<br>按 BOOT 键可唤醒菲菲AI进行对话。</div>
<div class="btn-area">
<button class="btn btn-reconfig" onclick="location.href='/'">🔄 重新配置</button>
<button class="btn btn-start" onclick="finish()">✅ 完成启动</button>
</div>
</div></div>
<script>
fetch('/api/config/status').then(function(r){return r.json()}).then(function(d){
var h='<div class="summary-item"><span class="summary-label">📡 课程表</span><span class="summary-value">'+(d.schedule_configured?'已配置':'未配置')+'</span></div>';
h+='<div class="summary-item"><span class="summary-label">🌤️ 天气</span><span class="summary-value">'+(d.weather_city||(d.weather_configured?'已配置':'未配置'))+'</span></div>';
document.getElementById('sum').innerHTML=h}).catch(function(){document.getElementById('sum').innerHTML='加载失败'});
function finish(){fetch('/api/finish',{method:'POST'}).then(function(){document.querySelector('.body').innerHTML='<div class="ok">🔄</div><h2>设备正在重启...</h2><p class="desc">请稍候，设备将自动连接WiFi并进入主页</p>'})}
</script></body></html>
